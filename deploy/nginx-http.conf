# Puregram — phase 1: HTTP only (serves the site + ACME challenge for certbot).
# Replaced by nginx-final.conf (HTTPS + redirect) once the cert is issued.
server {
    listen 80;
    listen [::]:80;
    server_name puregram.app www.puregram.app;

    root /var/www/puregram.app;
    index index.html;

    location /.well-known/acme-challenge/ { root /var/www/puregram.app; }
    location / { try_files $uri $uri/ =404; }
}
