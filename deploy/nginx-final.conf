# =============================================================================
# Puregram — production nginx (HTTPS, all surfaces). Scoped to puregram.app.
# Apply: sudo nginx -t && sudo systemctl reload nginx
# =============================================================================
#
# Surface map:
#   /              → /var/www/puregram.app/          (static marketing site)
#   /control/      → http://127.0.0.1:8020/          (FastAPI control API)
#   /control/v1/control/stream  ↑ nested SSE location (buffering off, long timeout)
#
# NOTE: nginx `add_header` does not concatenate adjacent quoted strings, so every
# header value (esp. the CSP) MUST be a single quoted string on one line.
# =============================================================================

# ── HTTP → HTTPS redirect + ACME challenge ───────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name puregram.app www.puregram.app;

    # Keep ACME reachable so certbot can renew the certificate.
    location /.well-known/acme-challenge/ {
        root /var/www/puregram.app;
    }

    # Redirect everything else to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS vhost ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name puregram.app www.puregram.app;

    ssl_certificate     /etc/letsencrypt/live/puregram.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/puregram.app/privkey.pem;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Document root for the public marketing site (also used by ACME).
    root  /var/www/puregram.app;
    index index.html;

    # ── Global security headers ───────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 'unsafe-inline' for styles/scripts: the site + SPA use Tailwind utility CSS
    # and React inline styles. Google Fonts is allowed explicitly.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # ── /app/ and /admin/ — REMOVED ──────────────────────────────────────────
    # The control SPA and the admin panel were retired with ADR-002: every user
    # governs their own allow/block lists, so there is no operator and nothing
    # to sign in to. /app/login used to answer here. Their document roots were
    # moved out of the web root at the same time as this edit.

    # ── /control/ — FastAPI control API (uvicorn on 127.0.0.1:8020) ──────────
    # The trailing slash on proxy_pass strips /control so FastAPI sees /v1/...
    location /control/ {
        proxy_pass         http://127.0.0.1:8020/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # ── SSE nested location — /control/v1/control/stream ─────────────────
        # Server-Sent Events need HTTP/1.1, no buffering, a long read timeout,
        # and a cleared Connection header so nothing buffers the stream.
        location = /control/v1/control/stream {
            proxy_pass         http://127.0.0.1:8020/v1/control/stream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_buffering       off;
            proxy_cache           off;
            proxy_read_timeout    3600s;
        }
    }

    # ── /r/ — Play review login-code page (review-relay/relay.py) ────────────
    # The directory name under /r/ is a random token handed only to Google in
    # the App access form. Never listed, never cached, never indexed: a cached
    # page would show the reviewer a stale code, and a listing would reveal the
    # token itself.
    location /r/ {
        autoindex off;
        try_files $uri $uri/ =404;

        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-ancestors 'none';" always;
    }

    # Android ships through Google Play only (2026-09-28). Old links to the
    # retired direct APK land on the store listing instead of a 404.
    location = /download/puregram.apk {
        return 302 https://play.google.com/store/apps/details?id=app.puregram;
    }

    # Nothing under a dot path is public: backups, temp files, VCS leftovers.
    # ACME's /.well-known/ is answered on :80 and stays reachable here too.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # ── / — public marketing site ─────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;
    }
}
