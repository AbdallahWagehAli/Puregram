# Add these two blocks INSIDE the existing puregram.app `server { ... }` (443)
# vhost, then: sudo nginx -t && sudo systemctl reload nginx
#
# 1) The control API (FastAPI on 127.0.0.1:8020). The trailing slash on
#    proxy_pass strips the /control prefix, so the app sees /v1/...
location /control/ {
    proxy_pass http://127.0.0.1:8020/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# 2) The static admin panel (vanilla HTML/CSS/JS) deployed to
#    /var/www/puregram.app/admin/ — served at https://puregram.app/admin/
location /admin/ {
    alias /var/www/puregram.app/admin/;
    index login.html index.html;
    try_files $uri $uri/ =404;
}
