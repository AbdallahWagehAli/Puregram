  <div class="wrap">
    <div class="legal-head">
      <span class="kicker" data-ar="القانوني" data-en="Legal"></span>
      <h1 data-ar="سياسة الخصوصية" data-en="Privacy Policy"></h1>
      <p class="upd" data-ar="آخر تحديث: يوليو 2026" data-en="Last updated: July 2026"></p>
    </div>

    <div class="legal-body">
      <section>
        <h2 data-ar="مقدمة" data-en="Introduction"></h2>
        <div class="legal-callout">
          <p data-ar="بيورجرام بناء مستقل غير رسمي مبني على عملاء Telegram مفتوحة المصدر، وليس تابعًا لـ Telegram أو معتمدًا منها. مراسلتك تظل تمرّ عبر بنية Telegram؛ بيورجرام يضيف طبقة تحكّم في المحتوى فقط." data-en="Puregram is an unofficial, independent build based on Telegram's open-source clients, not affiliated with or endorsed by Telegram. Your messaging still runs over Telegram's infrastructure; Puregram only adds a content-control layer."></p>
        </div>
        <p data-ar="توضّح هذه السياسة ما الذي يصل إلى خوادم بيورجرام وما الذي لا يصل، وكيف نحمي ذلك. باستخدامك بيورجرام فأنت توافق على هذه السياسة." data-en="This policy explains what does and does not reach Puregram's servers, and how we protect it. By using Puregram, you agree to this policy."></p>
      </section>
      <section>
        <h2 data-ar="ما لا نفعله" data-en="What we don't do"></h2>
        <ul>
          <li data-ar="لا نقرأ محتوى رسائلك ولا نخزّنه." data-en="We do not read or store the content of your messages."></li>
          <li data-ar="لا نبيع بياناتك أو نشاركها لأغراض تسويقية." data-en="We do not sell your data or share it for marketing."></li>
          <li data-ar="لا نتتبّعك عبر التطبيقات أو المواقع الأخرى." data-en="We do not track you across other apps or sites."></li>
          <li data-ar="لا نعرض إعلانات داخل التطبيق." data-en="We do not show ads inside the app."></li>
        </ul>
      </section>
      <section>
        <h2 data-ar="ما الذي يصل إلى خوادمنا" data-en="What reaches our servers"></h2>
        <p data-ar="لتتزامن قوائمك بين أجهزتك، يحفظ الخادم ما يلي وحده:" data-en="So your lists can sync between your devices, the server stores only the following:"></p>
        <ul>
          <li data-ar="معرّف حسابك الرقمي في تيليجرام — لا اسمك ولا رقم هاتفك ولا بريدك." data-en="Your numeric Telegram account id — not your name, phone number, or email."></li>
          <li data-ar="قوائمك: المحادثات التي سمحت بها أو حجبتها، وعنوان كل منها ومعرّفها." data-en="Your lists: the chats you allowed or blocked, with each one's title and identifier."></li>
          <li data-ar="معرّف الجهاز، لنعرف أي أجهزتك مصرّح لها بمزامنة قوائمك." data-en="A device identifier, so we know which of your devices may sync your lists."></li>
          <li data-ar="سجلات خادم الويب المعتادة (عنوان IP ووقت الطلب)، كما في أي موقع." data-en="Standard web-server access logs (IP address and request time), as on any website."></li>
        </ul>
        <p data-ar="لا نقرأ رسائلك ولا نخزّنها، ولا نصل إلى جهات اتصالك ولا وسائطك. المراسلة كلها تجري عبر بنية Telegram وتشفيرها، ولا تمرّ بخوادمنا. وتُنقل كل بياناتك عبر HTTPS." data-en="We do not read or store your messages, and we do not touch your contacts or media. All messaging runs over Telegram's infrastructure and encryption and never passes through our servers. Everything travels over HTTPS."></p>
        <p data-ar="قائمة ما حجبته تكشف شيئاً عنك، ونتعامل معها على هذا الأساس: لا نبيعها ولا نشاركها ولا نستخدمها لأي غرض غير مزامنة قوائمك بين أجهزتك." data-en="What you chose to block says something about you, and we treat it that way: we never sell it, share it, or use it for anything but syncing your lists between your devices."></p>
      </section>
      <section>
        <h2 data-ar="حذف بياناتك" data-en="Deleting your data"></h2>
        <p data-ar="يمكنك طلب حذف كل ما نحفظه لك من داخل التطبيق. ينفَّذ الطلب بعد ستين يوماً، وتبقى قوائمك سارية طوال المدة، ويمكنك إلغاء الطلب في أي وقت. المهلة مقصودة: الحذف يمحو أيضاً ما حجبته نهائياً، فلا نجعله باباً يُفتح في لحظة تراجع." data-en="You can request deletion of everything we store for you from inside the app. It takes effect after 60 days; your lists stay in force throughout, and you can cancel any time. The delay is deliberate: deletion also clears what you blocked forever, so we do not make it a door that opens in a weak moment."></p>
      </section>
      <section>
        <h2 data-ar="الأمان" data-en="Security"></h2>
        <p data-ar="تُنقل القائمة العامة عبر HTTPS فقط، ولوحة الأدمن محمية بكلمات مرور مجزّأة بخوارزمية حديثة، ولا تُسجَّل الأسرار في أي مكان." data-en="The global list travels over HTTPS only, the admin panel is protected by passwords hashed with a modern algorithm, and secrets are never logged."></p>
      </section>
      <section>
        <h2 data-ar="حقوقك" data-en="Your rights"></h2>
        <p data-ar="يحق لك الاستفسار عمّا نتعامل معه أو طلب حذف أي بيانات متبقية من النسخ الأقدم، في أي وقت عبر التواصل مع الدعم." data-en="You have the right to ask what we handle, or to request deletion of any data left over from older builds, at any time by contacting support."></p>
      </section>
      <section>
        <h2 data-ar="العلامات التجارية" data-en="Trademarks"></h2>
        <p data-ar="«Telegram» وشعارها علامتان تجاريتان لأصحابهما. بيورجرام مشروع مستقل غير تابع لـ Telegram FZ-LLC ولا معتمد منها." data-en="“Telegram” and its logo are trademarks of their respective owners. Puregram is an independent project, not affiliated with or endorsed by Telegram FZ-LLC."></p>
      </section>
      <section>
        <h2 data-ar="التواصل معنا" data-en="Contact us"></h2>
        <p data-ar="لأي استفسار حول الخصوصية، تواصل مع فريق دعم بيورجرام من داخل التطبيق." data-en="For any privacy question, contact the Puregram support team from within the app."></p>
      </section>
