apply plugin: 'com.android.application'

// Puregram: which app manifest this build uses.
//
// The sideloaded build keeps the in-app updater. The Play build must not have it:
// Google Play's Device and Network Abuse policy forbids an app downloading and
// installing executable code outside Play, and REQUEST_INSTALL_PACKAGES has no
// approved use case for a messenger. So for -PpuregramPlay we DERIVE a manifest
// from the real one and strip the two pieces that make self-updating possible.
// Deriving (rather than keeping a second copy) means the two cannot drift.
def puregramManifest() {
    def base = file('../TMessagesProj/config/release/AndroidManifest_standalone.xml')
    if (!project.hasProperty("puregramPlay")) {
        return base
    }
    def out = new File(buildDir, 'puregram/AndroidManifest_standalone_play.xml')
    out.parentFile.mkdirs()
    def text = base.text
    def marker = '<uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>'
    if (!text.contains(marker) || !text.contains('</application>')) {
        throw new GradleException("Puregram: cannot derive the Play manifest \u2014 " +
                "AndroidManifest_standalone.xml no longer has the expected anchors.")
    }
    text = text.replace(marker, marker + '''

    <!-- Puregram (Play build): no self-update path. Google Play updates this build. -->
    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" tools:node="remove" />''')
    text = text.replace('</application>', '''
        <!-- Puregram (Play build): the update receiver goes with it. -->
        <receiver android:name="org.telegram.messenger.PuregramUpdateReceiver" tools:node="remove" />

    </application>''')
    out.text = text
    return out
}

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.core:core:1.16.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig.applicationId = APP_PACKAGE

    sourceSets.main.jniLibs.srcDirs = ['../TMessagesProj/jni/']

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    signingConfigs {
        debug {
            storeFile file("../TMessagesProj/config/release.keystore")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }

        release {
            storeFile file("../TMessagesProj/config/release.keystore")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            minifyEnabled false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro', '../TMessagesProj/proguard-rules-beta.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
        standalone {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }
    sourceSets.standalone {
        manifest.srcFile puregramManifest()
    }

    flavorDimensions "minApi"

    productFlavors {
        afat {
            ndk {
                // Puregram: distribution build targets real devices only (arm64-v8a).
                // x86_64 is omitted to shrink the APK. Pass -PemulatorAbi to add it
                // back for a run on the x86_64 emulator; without the flag the
                // published artifact is unchanged.
                if (project.hasProperty("emulatorAbi")) {
                    abiFilters "arm64-v8a", "x86_64"
                } else {
                    abiFilters "arm64-v8a"
                }
            }
            ext {
                abiVersionCode = 9
            }
            sourceSets.standalone {
                manifest.srcFile puregramManifest()
            }
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "app.apk"
            output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36
        versionName APP_VERSION_NAME
        ndkVersion "27.1.12297006"

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.web'

    lintOptions {
        checkReleaseBuilds false
    }
}

apply plugin: 'com.google.gms.google-services'
